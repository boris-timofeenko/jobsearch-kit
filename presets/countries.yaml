  local_languages: [german]
  salary_floor_month: 3828        # Blue Card для профессий с дефицитом кадров (IT), ~€45.9k в год; общий порог ~€50.7k
  visa_scheme: "EU Blue Card"
  geo: [51.1657, 10.4515]

