# Каталог стран для target.country / target.countries в my/profile.yaml: там достаточно написать код («de»),
# остальное берётся отсюда. Любое поле можно переопределить в профиле:
#   target:
#     country: {code: de, salary_floor_month: 4225, city: Munich}
#
# location_regex — как страна и её города пишутся в поле «локация» вакансии (на английском и на местном языке).
# local_languages — языки страны: текст вакансии на нидерландском/немецком/французском отсекается, если этого языка
#   нет в candidate.languages; для остальных языков решает модель по требованию в тексте.
# salary_floor_month — месячный гросс в евро, ниже 90% которого вакансия отсекается, если зарплата указана.
#   Это ОРИЕНТИРЫ визовых порогов на 2026 год (Blue Card и национальные схемы для IT), а не юридическая справка:
#   пороги индексируются каждый год и зависят от возраста, диплома и региона. Перед настройкой проверь актуальную
#   цифру на сайте миграционной службы. Если виза не нужна (гражданство ЕС), поставь сюда свой минимум.
# visa_scheme — название схемы для рубрики модели. city — главный IT-город: модель оценивает вакансию «как будто
#   она там», а The Muse ищет по нему. geo — координаты центра страны для резервного поиска hiring.cafe.
# sponsor_register: ind — только Нидерланды: публичный реестр признанных спонсоров IND, по нему проверяется каждый
#   работодатель. Для других стран такого открытого реестра нет.

nl:
  name: Netherlands
  label: "🇳🇱 Нидерланды"
  city: Amsterdam
  location_regex: '\b(netherlands|nederland|holland|amsterdam|rotterdam|utrecht|eindhoven|the hague|den haag|groningen|leiden|delft|haarlem|amstelveen|hilversum|nijmegen|tilburg|breda|arnhem|zwolle|enschede|maastricht|almere|apeldoorn|hoofddorp|schiphol|veldhoven|''s-hertogenbosch|den bosch|amersfoort|zeist|\bnl\b)'
  local_languages: [dutch]
  salary_floor_month: 5942        # HSM (kennismigrant) 30+, без holiday allowance
  salary_floor_under_30: 4357     # HSM до 30 лет; берётся, если candidate.birth_year моложе 30
  visa_scheme: "HSM (kennismigrant)"
  sponsor_register: ind
  geo: [52.1326, 5.2913]

