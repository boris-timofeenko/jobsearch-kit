# Каталог стран для switches.countries и switches.offices в my/profile.yaml: там достаточно написать код («de»),
# остальное берётся отсюда. Страны нет в каталоге — опиши её в профиле целиком (code, name, location_regex, part).
# Любое поле можно переопределить:
#   switches:
#     countries: [{code: de, salary_floor_month: 4225, city: Munich}, nl]
#
# location_regex — как страна и её города пишутся в поле «локация» вакансии: по-английски, на местном языке и
#   по-русски (Хабр Карьера и русскоязычные Telegram-каналы пишут «Белград», «Москва»).
# part — часть света: eu (ЕС, ЕЭЗ и Швейцария), europe (остальная Европа), cis (СНГ и Кавказ), middle_east
#   (Ближний Восток и Африка), americas, asia. По ней решается, доступна ли remote-вакансия из твоей страны:
#   «Remote, US» для живущего в Грузии — нет, «Remote, EMEA» — да (Европа и СНГ считаются одной зоной).
# local_languages — языки страны, справочно (правила их не читают): отсев по языку идёт по самому тексту вакансии —
#   объявление на нидерландском, немецком, французском или русском отсекается, если этого языка нет в
#   switches.languages; требование других языков видит модель.
# salary_floor_month — месячный гросс в евро, ниже 90% которого вакансия отсекается, если зарплата указана.
#   Это ОРИЕНТИРЫ визовых порогов на 2026 год (Blue Card и национальные схемы для IT), а не юридическая справка:
#   пороги индексируются каждый год и зависят от возраста, диплома и региона. Перед настройкой проверь актуальную
#   цифру на сайте миграционной службы. Если виза не нужна (гражданство или ВНЖ), порог страны не применяется: свой
#   минимум — switches.salary_min в профиле.
# visa_scheme — название схемы для рубрики модели. city — главный IT-город: модель оценивает вакансию «как будто
#   она там», а The Muse ищет по нему. geo — координаты центра страны для резервного поиска hiring.cafe.
# aggregators — доски этой страны, которые включаются сами, если страна в целях или ты в ней живёшь
#   (switches.based_in): habr — Хабр Карьера.
# sponsor_register: ind — только Нидерланды: публичный реестр признанных спонсоров IND, по нему проверяется каждый
#   работодатель. Для других стран такого открытого реестра нет.

nl:
  name: Netherlands
  label: "🇳🇱 Нидерланды"
  city: Amsterdam
  location_regex: '\b(netherlands|nederland|holland|amsterdam|rotterdam|utrecht|eindhoven|the hague|den haag|groningen|leiden|delft|haarlem|amstelveen|hilversum|nijmegen|tilburg|breda|arnhem|zwolle|enschede|maastricht|almere|apeldoorn|hoofddorp|schiphol|veldhoven|''s-hertogenbosch|den bosch|amersfoort|zeist|\bnl\b|нидерланды|голландия|амстердам|роттердам|утрехт|эйндховен|гаага)'
  local_languages: [dutch]
  salary_floor_month: 5942        # HSM (kennismigrant) 30+, без holiday allowance
  salary_floor_under_30: 4357     # HSM до 30 лет; берётся, если candidate.birth_year моложе 30
  visa_scheme: "HSM (kennismigrant)"
  sponsor_register: ind
  geo: [52.1326, 5.2913]
  part: eu

